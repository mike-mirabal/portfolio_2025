<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio – Mike Mirabal</title>
  <link rel="stylesheet" href="styles/index.css" />
  <link rel="stylesheet" href="styles/projects.css">
  <link rel="icon" type="image/png" href="assets/favicon.png" />
</head>
<body id="top" data-theme="light">
<div class="page-wrapper">
  
  <!-- SIDE NAV -->
  <nav id="sideNav" class="side-nav" aria-hidden="true">
    <ul class="nav-list">
      <!-- New Chat now points to the old homepage, renamed to chat.html -->
      <li><a href="chat.html">New Chat</a></li>
      <li class="has-sub">
        <button class="sub-toggle">Contact Mike</button>
        <ul class="sub-list">
          <li><a href="mailto:info@mikemirabal.com">Email</a></li>
          <li><a href="https://linkedin.com/in/mikemirabal" target="_blank">LinkedIn</a></li>
        </ul>
      </li>
      <li class="has-sub">
        <button class="sub-toggle">Projects</button>
        <ul class="sub-list">
          <!-- IMPORTANT: point all project links to index.html now -->
          <li><a href="index.html?filter=all">View All</a></li>
          <li><a href="index.html?filter=brand">Brand</a></li>
          <li><a href="index.html?filter=creative">Creative</a></li>
          <li><a href="index.html?filter=digital">Digital</a></li>
          <li><a href="index.html?filter=innovation">Innovation</a></li>
          <li><a href="index.html?filter=operations">Operations</a></li>
          <li><a href="index.html?filter=product">Product</a></li>
        </ul>
      </li>
    </ul>
  </nav>

  <!-- HEADER -->
  <div class="header">
    <button id="navToggle" class="nav-toggle" aria-label="Toggle navigation">
      <span class="bar"></span><span class="bar"></span><span class="bar"></span>
    </button>
    <div class="theme-switch" onclick="toggleTheme()"></div>
  </div>

  <!-- MAIN -->
  <div id="pageContent" class="main-container">
    <h1 id="projectsSubheading" class="projects-subheading"></h1>
    <h3 class="section-title">Projects</h3>

    <div class="filters">
      <button class="active" onclick="selectFilter(this)">All</button>
      <button onclick="selectFilter(this)">Brand</button>
      <button onclick="selectFilter(this)">Creative</button>
      <button onclick="selectFilter(this)">Digital</button>
      <button onclick="selectFilter(this)">Innovation</button>
      <button onclick="selectFilter(this)">Operations</button>
      <button onclick="selectFilter(this)">Product</button>
    </div>

    <div class="grid" id="projectGrid"></div>

    <p class="back-to-top"><a href="#top">Back to top ↑</a></p>
  </div>

  <!-- FOOTER -->
  <footer class="compact-footer">
    Mike Mirabal © 2025 | Powered by Aigentask
  </footer>

</div>

<!-- THEME INIT -->
<script>
  (function() {
    const saved = localStorage.getItem('theme');
    const theme = saved === 'dark' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', theme);
  })();

  function toggleTheme() {
    const html = document.documentElement;
    const current = html.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    const next = current === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
  }

  // SIDE NAV behaviors
  (function() {
    const nav    = document.getElementById('sideNav');
    const toggle = document.getElementById('navToggle');
    const page   = document.getElementById('pageContent');

    toggle.addEventListener('click', e => {
      e.stopPropagation();
      nav.classList.toggle('open');
      const isOpen = nav.classList.contains('open');
      nav.setAttribute('aria-hidden', !isOpen);
      if (!isOpen) {
        document.querySelectorAll('.side-nav .has-sub.open')
          .forEach(li => li.classList.remove('open'));
      }
    });

    page.addEventListener('click', () => {
      if (nav.classList.contains('open')) closeNav();
    });

    function closeNav() {
      nav.classList.remove('open');
      nav.setAttribute('aria-hidden', 'true');
      document.querySelectorAll('.side-nav .has-sub.open')
        .forEach(li => li.classList.remove('open'));
    }

    document.querySelectorAll('.sub-toggle').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        btn.parentElement.classList.toggle('open');
      });
    });

    window.addEventListener('scroll', () => {
      if (nav.classList.contains('open')) closeNav();
    });
  })();

  window.addEventListener('pageshow', () => {
    const nav = document.getElementById('sideNav');
    nav.classList.remove('open');
    nav.setAttribute('aria-hidden', 'true');
    document.querySelectorAll('.side-nav .has-sub.open')
      .forEach(li => li.classList.remove('open'));
  });

  // Filter helpers (same logic as projects.html)
  function selectFilter(button) {
    const filter = button.textContent.trim().toLowerCase();
    document.querySelectorAll('.filters button').forEach(btn => btn.classList.remove('active'));
    button.classList.add('active');

    document.querySelectorAll('.card').forEach(card => {
      const tags = card.dataset.tags.split(',').map(t => t.trim());
      card.style.display = filter === 'all' || tags.includes(filter) ? '' : 'none';
    });

    document.getElementById('projectsSubheading').textContent = ({
      all:'Creating Impact Through Design and Innovation',
      brand:'Building Identities that Connect and Convert',
      creative:'Bringing Ideas to Life with Visual Storytelling',
      digital:'Creating Engaging Digital Touchpoints',
      innovation:'Exploring What’s Next in Digital Experiences',
      operations:'Streamlining Systems for Better Outcomes',
      product:'Designing Experiences that Users Love'
    })[filter] || 'Projects';

    const newUrl = new URL(window.location);
    newUrl.searchParams.set('filter', filter);
    window.history.pushState({}, '', newUrl);
  }

  document.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(window.location.search);
    const filter = params.get('filter') || 'all';

    document.querySelectorAll('.filters button').forEach(btn => {
      const btnFilter = btn.textContent.trim().toLowerCase();
      btn.classList.toggle('active', btnFilter === filter);
    });

    document.getElementById('projectsSubheading').textContent = ({
      all:'Creating Impact Through Design and Innovation',
      brand:'Building Identities that Connect and Convert',
      creative:'Bringing Ideas to Life with Visual Storytelling',
      digital:'Creating Engaging Digital Touchpoints',
      innovation:'Exploring What’s Next in Digital Experiences',
      operations:'Streamlining Systems for Better Outcomes',
      product:'Designing Experiences that Users Love'
    })[filter] || 'Projects';
  });
</script>

<!-- CSV + project rendering -->
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js" defer></script>
<script src="scripts/filters.js" defer></script>
<script src="/scripts/project.js" defer></script>
</body>
</html>
