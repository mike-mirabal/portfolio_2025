<!-- ───────── SCRIPTS ───────── -->
<script>
  // Theme persistence
  (function() {
    const saved = localStorage.getItem('theme');
    const theme = saved === 'dark' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', theme);
  })();

  function toggleTheme() {
    const html = document.documentElement;
    const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    html.setAttribute('data-theme', next);
    localStorage.setItem('theme', next);
  }
</script>

<script>
  // Side nav toggle (kept for other pages; hidden here by CSS)
  document.addEventListener('DOMContentLoaded', () => {
    const nav = document.getElementById('sideNav');
    const toggle = document.getElementById('navToggle');
    const page = document.getElementById('pageContent');

    if (toggle) {
      toggle.addEventListener('click', e => {
        e.stopPropagation();
        nav.classList.toggle('open');
        toggle.classList.toggle('open');
        nav.setAttribute('aria-hidden', !nav.classList.contains('open'));
      });
    }

    page.addEventListener('click', () => {
      if (nav.classList.contains('open')) {
        nav.classList.remove('open');
        if (toggle) toggle.classList.remove('open');
        nav.setAttribute('aria-hidden', 'true');
      }
    });

    document.querySelectorAll('.sub-toggle').forEach(btn => {
      btn.addEventListener('click', e => {
        e.stopPropagation();
        btn.parentElement.classList.toggle('open');
      });
    });
  });
</script>

<script>
  // Close side nav on scroll
  window.addEventListener('scroll', () => {
    const nav = document.getElementById('sideNav');
    const toggle = document.getElementById('navToggle');
    if (nav && nav.classList.contains('open')) {
      nav.classList.remove('open');
      if (toggle) toggle.classList.remove('open');
      nav.setAttribute('aria-hidden', 'true');
      document.querySelectorAll('.side-nav .has-sub.open')
        .forEach(li => li.classList.remove('open'));
    }
  });
</script>

<!-- Dependencies -->
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js" defer></script>
<script src="scripts/filters.js" defer></script>

</html>
